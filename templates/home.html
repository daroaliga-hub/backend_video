{% extends "base.html" %}
{% load thumbnail %}
{% block title %}My Home Page  10{% endblock %}
{% block body %}
    {%for post in posts%}
        {{post.text}} <br>
        {% thumbnail post.image "500x500" crop="center" as im %}
            <img src="{{ im.url }}" width="{{ im.width }}" height="{{ im.height }}" alt="{{ post.text }}">
        {% endthumbnail %}
        <hr>
    {%endfor%}

{% endblock %}
