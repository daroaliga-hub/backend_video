{% extends "base.html" %}
{% load thumbnail %}
{% block title %}My Home Page  10{% endblock %}
{% block body %}

    <a href="{% url 'feed:post' %}">Add a new post &rarr;</a>
    <hr>
    {%for post in posts%}
        <a href="{% url 'feed:details' post.id %}" style="display: inline-block;">
            {{post.text}} <br>
            {% thumbnail post.image "500x500" crop="center" as im %}
                <img src="{{ im.url }}" width="{{ im.width }}" height="{{ im.height }}" alt="{{ post.text }}">
            {% endthumbnail %}

        </a>
        <hr>
    {%endfor%}

{% endblock %}
